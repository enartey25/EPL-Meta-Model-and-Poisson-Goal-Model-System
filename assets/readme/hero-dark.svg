<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="EPL Meta-Model: Premier League forecasts from a stacked XGBoost + Random Forest ensemble and a zone-calibrated Poisson goal model.">
