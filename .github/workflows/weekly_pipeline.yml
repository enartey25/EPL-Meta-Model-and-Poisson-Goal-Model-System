name: Weekly EPL Model Retraining Pipeline

on:
  schedule:
    # Runs every Wednesday at 04:00 AM UTC
    - cron: '0 4 * * 3'
  workflow_dispatch:
    # Allows manual trigger via GitHub Actions UI

permissions:
  contents: write

jobs:
  retrain-pipeline:
    name: Ingest Data & Retrain Models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Weekly Retraining Pipeline
        run: |
          python -m pipeline.run_pipeline --output epl_predictor_assets.pkl

      - name: Run Test Suite
        run: |
          python -c "from predictor import predict_match; r = predict_match('Arsenal', 'Chelsea'); print('Smoke test OK:', r['predicted_outcome'])"

      - name: Commit and Push Updated Model Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epl_predictor_assets.pkl
          if git diff --staged --quiet; then
            echo "No changes in model assets. Skipping commit."
          else
            git commit -m "chore(pipeline): weekly automated model retraining [skip ci]"
            git push origin main
          fi
