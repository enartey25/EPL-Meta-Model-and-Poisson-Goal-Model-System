name: Weekly pipeline - data refresh, track record and model retraining

on:
  schedule:
    # Every Wednesday at 04:00 UTC
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force a full retrain (ignores the 50-match threshold)'
        required: false
        type: boolean
        default: false
  push:
    # Rebuild the assets whenever the model code changes
    paths:
      - 'pipeline/**'
      - 'inference_utils.py'
      - 'requirements.txt'
      - '.github/workflows/weekly_pipeline.yml'

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force_retrain }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            FLAGS="--force-retrain"
          fi
          python -m pipeline.run_pipeline $FLAGS

      - name: Smoke test
        run: python predictor.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epl_predictor_assets.pkl data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(pipeline): automated data refresh and model update [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
