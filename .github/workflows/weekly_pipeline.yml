name: EPL Pipeline - Weekly State Update & 5-Gameweek Model Retraining

on:
  schedule:
    # Runs automatically every Wednesday at 04:00 AM UTC
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force full XGBoost, RF & Meta-Learner retraining (ignores 50-match threshold)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-pipeline:
    name: Run Dual-Cadence Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force_retrain }}" = "true" ]; then
            FLAGS="--force-retrain"
          fi
          python -m pipeline.run_pipeline --output epl_predictor_assets.pkl $FLAGS

      - name: Run Smoke Test
        run: |
          python -c "from predictor import predict_match; r = predict_match('Arsenal', 'Chelsea'); print('Smoke test OK:', r['predicted_outcome'], r['confidence'])"

      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epl_predictor_assets.pkl
          if git diff --staged --quiet; then
            echo "No changes in model assets. Skipping commit."
          else
            git commit -m "chore(pipeline): automated weekly state update / 5-gameweek retraining [skip ci]"
            git push origin main
          fi
